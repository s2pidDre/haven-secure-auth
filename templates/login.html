<div class="page-top"><span class="step-tag">LET’S GET YOU SETTLED</span><span class="small-label">New here? <a href="/register">Create an account</a></span></div>
<header class="form-heading"><h2>Welcome back.</h2><p>Sign in to your own little space.</p></header>
{{error}}{{message}}
<form method="post" action="/login" class="auth-form" data-submit-label="Signing in…">
  <input type="hidden" name="csrf" value="{{csrf}}">
  <div class="form-field"><label for="email">Email address</label><input id="email" name="email" type="email" maxlength="254" value="{{email}}" autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false" placeholder="you@example.com" required></div>
  <div class="form-field"><label for="password">Password</label><div class="password-field"><input id="password" name="password" type="password" maxlength="128" autocomplete="current-password" required><button type="button" class="password-toggle" aria-controls="password" aria-pressed="false" aria-label="Show password" data-toggle-password="password">Show</button></div></div>
  <p class="form-helper">You’ll verify with an authenticator code next.</p>
  <button class="primary-button" type="submit"><span>Sign in</span><span aria-hidden="true">→</span></button>
</form>
