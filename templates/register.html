<div class="page-top"><span class="step-tag">MAKE YOURSELF AT HOME</span><span class="small-label">Already a member? <a href="/login">Sign in</a></span></div>
<header class="form-heading"><h2>Your space starts here.</h2><p>Create an account. Keep the good things protected.</p></header>
{{error}}{{message}}
<form method="post" action="/register" class="auth-form" data-submit-label="Creating account…">
  <input type="hidden" name="csrf" value="{{csrf}}">
  <div class="form-field"><label for="name">Your name</label><input id="name" name="name" type="text" maxlength="80" value="{{name}}" autocomplete="name" placeholder="What should we call you?" required></div>
  <div class="form-field"><label for="email">Email address</label><input id="email" name="email" type="email" maxlength="254" value="{{email}}" autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false" placeholder="you@example.com" required></div>
  <div class="form-field"><label for="password">Password</label><div class="password-field"><input id="password" name="password" type="password" minlength="15" maxlength="128" autocomplete="new-password" aria-describedby="password-help" required><button type="button" class="password-toggle" aria-controls="password" aria-pressed="false" aria-label="Show password" data-toggle-password="password">Show</button></div><p class="helper" id="password-help">15–128 characters. Try a long, unique passphrase.</p></div>
  <div class="form-field"><label for="confirm-password">Confirm password</label><div class="password-field"><input id="confirm-password" name="confirm_password" type="password" minlength="15" maxlength="128" autocomplete="new-password" required><button type="button" class="password-toggle" aria-controls="confirm-password" aria-pressed="false" aria-label="Show password" data-toggle-password="confirm-password">Show</button></div></div>
  <button class="primary-button" type="submit"><span>Create account</span><span aria-hidden="true">→</span></button>
  <p class="form-helper">Have an authenticator app ready. You’ll set it up on your first sign-in.</p>
</form>
